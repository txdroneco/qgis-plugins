<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Map background -->
  <rect x="4" y="4" width="56" height="56" rx="6" fill="#e8f4e8" stroke="#2d7d2d" stroke-width="2"/>
  <!-- Grid lines -->
  <line x1="4" y1="24" x2="60" y2="24" stroke="#b8d8b8" stroke-width="0.5"/>
  <line x1="4" y1="44" x2="60" y2="44" stroke="#b8d8b8" stroke-width="0.5"/>
  <line x1="24" y1="4" x2="24" y2="60" stroke="#b8d8b8" stroke-width="0.5"/>
  <line x1="44" y1="4" x2="44" y2="60" stroke="#b8d8b8" stroke-width="0.5"/>
  <!-- Flight path -->
  <polyline points="12,48 20,36 32,28 44,20 52,16" fill="none" stroke="#3388ff" stroke-width="2" stroke-dasharray="4,2"/>
  <!-- Camera markers -->
  <circle cx="12" cy="48" r="5" fill="#e74c3c" stroke="white" stroke-width="1.5"/>
  <circle cx="20" cy="36" r="5" fill="#e67e22" stroke="white" stroke-width="1.5"/>
  <circle cx="32" cy="28" r="5" fill="#f1c40f" stroke="white" stroke-width="1.5"/>
  <circle cx="44" cy="20" r="5" fill="#2ecc71" stroke="white" stroke-width="1.5"/>
  <circle cx="52" cy="16" r="5" fill="#3498db" stroke="white" stroke-width="1.5"/>
  <!-- Camera icon on center marker -->
  <rect x="28" y="25" width="8" height="6" rx="1" fill="white"/>
  <circle cx="32" cy="28" r="1.5" fill="#f1c40f"/>
</svg>
